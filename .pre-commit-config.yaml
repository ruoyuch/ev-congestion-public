repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^(data|tests/reference)/
      - id: trailing-whitespace
        exclude: ^(data|tests/reference)/
      # the shipped data (data/) is large by design; everything else stays small
      - id: check-added-large-files
        args: ["--maxkb=5000"]
        exclude: ^data/
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
