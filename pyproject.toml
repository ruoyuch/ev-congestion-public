[project]
name = "ev-congestion"
version = "1.0.0"
description = "Replication code and data: the electric vehicle transition exacerbates traffic congestion in California"
authors = [{ name = "Ruoyu Chen" }, { name = "Hang Liu" }, { name = "Mingzhi Zhou" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
# Exact versions used to produce the paper. Newer releases run fine but can
# change the last floating-point digits of the intermediate CSVs.
dependencies = [
    "geopandas==1.1.1",
    "matplotlib==3.10.6",
    "numpy==2.3.5",
    "openpyxl==3.1.5",   # reads the CEC vehicle-population workbook
    "pandas==2.3.3",
    "pyogrio==0.8.0",
    "pyproj==3.6.1",
    "requests==2.32.3",  # Census API downloads (covariates --download)
    "scipy==1.16.1",
    "shapely==2.0.4",
]

[project.optional-dependencies]
# only for downloading raw PeMS files (src/ev_congestion/pems_download.py)
download = ["selenium>=4"]

[dependency-groups]
dev = ["pytest", "ruff", "prek"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_congestion"]

[tool.ruff]
line-length = 100
src = ["src", "pipeline", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by ruff-format

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
